name: Mobile immutable release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter one-autojs6-mobile typecheck
      - run: pnpm --filter one-autojs6-mobile test
      - name: Build immutable artifact
        id: artifact
        run: |
          node scripts/build-mobile-release.mjs "${GITHUB_REF_NAME}"
          metadata="${GITHUB_WORKSPACE}/.tmp/releases/${GITHUB_REF_NAME}.metadata.json"
          test -f "${metadata}"
          first_sha="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).artifactSha256)' "${metadata}")"
          node scripts/build-mobile-release.mjs "${GITHUB_REF_NAME}"
          second_sha="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).artifactSha256)' "${metadata}")"
          test "${first_sha}" = "${second_sha}"
          echo "metadata=${metadata}" >> "${GITHUB_OUTPUT}"
      - name: Publish to Node Server
        env:
          NODE_SERVER_RELEASE_URL: ${{ secrets.NODE_SERVER_RELEASE_URL }}
          MOBILE_RELEASE_PUBLISH_TOKEN: ${{ secrets.MOBILE_RELEASE_PUBLISH_TOKEN }}
        run: node scripts/publish-mobile-release.mjs "${{ steps.artifact.outputs.metadata }}"
